# ZeRO-3 with CPU offload of optimizer + params — for 16k-completion GRPO on 40GB A100.
# Offloading frees ~half the GPU (optimizer states + sharded params live on host RAM,
# which is ~1TB here) so activations for 16384-token sequences + colocate vLLM fit.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: cpu
  offload_param_device: cpu
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
